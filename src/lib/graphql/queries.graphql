query GetProducts {
  products {
    id
    name
    colors {
      id
      images
      price
      sizes
    }
  }
}
query GetProductDetails($id: Int!) {
  product(id: $id) {
    id
    name
    brand
    colors {
      id
      name
      price
      description
      images
      sizes
    }
  }
  sizes {
    id
    name
    number
  }
}
